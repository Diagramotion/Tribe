name: Desktop builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build web assets for packaging checks
        run: npm run build
      - run: python -m pip install uv
      - run: uv sync --project runtime --extra ai --extra desktop --extra test
      - name: Runtime invariants
        env:
          # The runtime tests construct provider-backed agents but never call the live API.
          OPENAI_API_KEY: tribe-ci-test-key
        run: uv run --project runtime --extra ai --extra desktop --extra test python -m unittest discover -s runtime/tests
      - name: Sites packaging checks
        run: npm run test:sites
      - name: UI projection tests
        run: npm run test:ui
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/tribe-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/tribe-developer-id.p12"
          api_key_path="$RUNNER_TEMP/Tribe-NotaryKey.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -Fq "\"$APPLE_SIGNING_IDENTITY\"" || {
              echo "::error::The configured identity is not present in the imported Developer ID certificate."
              exit 1
            }
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Build desktop bundle for CI
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
      - name: Build and notarize macOS release app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/tribe-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/tribe-developer-id.p12" "$RUNNER_TEMP/Tribe-NotaryKey.p8"
      - name: Verify desktop bundle and app lifecycle
        run: python scripts/verify-desktop-bundles.py --target ${{ matrix.target }}
      - name: Native shell tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SWIFT_BIN="$(xcrun --find swift)"
          SWIFT_TOOLCHAIN="${SWIFT_BIN%/usr/bin/swift}"
          SWIFT_RUNTIME="$SWIFT_TOOLCHAIN/usr/lib/swift-5.5/macosx"
          test -f "$SWIFT_RUNTIME/libswift_Concurrency.dylib"
          DYLD_FALLBACK_LIBRARY_PATH="$SWIFT_RUNTIME${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Native shell tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Packaged runtime smoke check
        run: uv run --project runtime python scripts/smoke-runtime.py --target ${{ matrix.target }} --agent-dir agents
      - name: Package macOS app for GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tribe.app" \
            "release-assets/Tribe-${RELEASE_VERSION}-macos-arm64.zip"
      - name: Stage Windows installers for GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $msi -or -not $nsis) { throw "Expected both MSI and NSIS installers." }
          Copy-Item $msi.FullName (Join-Path $releaseDirectory "Tribe-$env:RELEASE_VERSION-windows-x64.msi")
          Copy-Item $nsis.FullName (Join-Path $releaseDirectory "Tribe-$env:RELEASE_VERSION-windows-x64-setup.exe")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tribe-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tribe-release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [electron-browser]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified Electron installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name tribe-electron-release-aarch64-apple-darwin --dir release-assets
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name tribe-electron-release-x86_64-pc-windows-msvc --dir release-assets
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tribe $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --latest

  electron-browser:
    name: Electron browser (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package-platform: mac
            package-target: zip
            package-app: release/electron/mac-arm64/Tribe.app/Contents/MacOS/Tribe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package-platform: win
            package-target: nsis
            package-app: release/electron/win-unpacked/Tribe.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set Electron version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: python -m pip install uv
      - run: uv sync --project runtime --extra ai --extra desktop
      - name: Prepare Electron macOS signing and notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/tribe-electron-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/tribe-developer-id.p12"
          api_key_path="$RUNNER_TEMP/Tribe-NotaryKey.p8"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -Fq "\"$APPLE_SIGNING_IDENTITY\"" || {
              echo "::error::The configured identity is not present in the imported Developer ID certificate."
              exit 1
            }
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_NAME=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
      - name: Browser unit tests
        run: npm run test:browser
      - name: Live Electron browser and agent test
        run: npm run test:browser:e2e
        env:
          TRIBE_BROWSER_E2E_AUTO_UPLOAD: "1"
          TRIBE_BROWSER_E2E_SKIP_APPROVAL: "1"
      - name: Build unpacked Electron app
        run: npm run build && npm run runtime:package && npx electron-builder --${{ matrix.package-platform }} --dir --publish never
      - name: Build Electron installer
        run: npx electron-builder --${{ matrix.package-platform }} ${{ matrix.package-target }} --publish never
      - name: Live packaged browser and agent test
        run: npm run test:browser:e2e
        env:
          TRIBE_BROWSER_E2E_PACKAGED_APP: ${{ matrix.package-app }}
          TRIBE_BROWSER_E2E_AUTO_UPLOAD: "1"
          TRIBE_BROWSER_E2E_SKIP_APPROVAL: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tribe-electron-${{ matrix.target }}
          path: release/electron/**
      - name: Stage macOS Electron release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          installer=$(find release/electron -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$installer"
          cp "$installer" "release-assets/Tribe-${RELEASE_VERSION}-macos-arm64.zip"
      - name: Stage Windows Electron release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/electron" -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $installer) { throw "Expected an Electron Windows installer." }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets/Tribe-$env:RELEASE_VERSION-windows-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tribe-electron-release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
      - name: Remove Electron signing credentials
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/tribe-electron-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/tribe-developer-id.p12" "$RUNNER_TEMP/Tribe-NotaryKey.p8"
