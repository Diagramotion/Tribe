[package]
name = "tribe"
version = "0.1.0"
description = "Local-first multi-agent engineering harness"
authors = ["Tribe"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
png = "0.18"
screencapturekit = { version = "11.1.0", features = ["async", "macos_14_0"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Graphics_Capture"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
